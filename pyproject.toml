[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "david-sling-iatos"
description = "DAVID SLING - Institutional Algorithmic Trading Operating System (IATOS), pure Python 3.12+ architecture"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "DAVID SLING Engineering" }]
dependencies = [
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.5",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "orjson>=3.10.7",
    "websockets>=12.0",
    "aiohttp>=3.10.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7.2", "pyqtgraph>=0.13.7", "qasync>=0.27.1", "superqt>=0.6.7"]
quant = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pandas>=2.2.2",
    "polars>=1.5.0",
    "networkx>=3.3",
    "scikit-learn>=1.5.1",
    "statsmodels>=0.14.2",
    "arch>=7.0.0",
    "PyWavelets>=1.6.0",
    "hmmlearn>=0.3.2",
    "giotto-tda>=0.6.0",
]
persist = ["rocksdict>=0.3.28", "aiosqlite>=0.20.0", "redis>=5.0.8", "pyarrow>=17.0.0"]
broker = ["quickfix>=1.15.1", "MetaTrader5>=5.0.45; sys_platform == 'win32'"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
david_sling = ["py.typed", "api/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
