[mypy]
python_version = 3.11
# strict-equivalent gate, minus the two noisiest Any-related checks
# (bare dict/list annotations and untyped FastAPI handlers are allowed)
warn_return_any = true
warn_unused_configs = true
disallow_untyped_calls = true
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
strict_equality = true
ignore_missing_imports = true
mypy_path = src
packages = david_sling

[mypy-david_sling.application.desktop.*]
# PySide6 stub gaps only: QPointF/QRectF overload variants missing from stubs and
# Optional-wrapped Qt returns - runtime-verified via offscreen tests. attr-defined
# and no-untyped-call stay ENABLED so real paint bugs (e.g. QPainter.lineTo) fail the gate.
disable_error_code = call-overload, union-attr, misc
