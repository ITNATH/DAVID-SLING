[mypy]
python_version = 3.11
# strict-equivalent gate, minus the two noisiest Any-related checks
# (bare dict/list annotations and untyped FastAPI handlers are allowed)
warn_return_any = true
warn_unused_configs = true
disallow_untyped_calls = true
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
strict_equality = true
ignore_missing_imports = true
mypy_path = src
packages = david_sling

[mypy-david_sling.application.desktop.*]
# PySide6 stub limitations: QPointF overloads, QPainter.lineTo/closePath missing
# from stubs, untyped Qt signal callbacks - runtime-verified via offscreen tests.
disable_error_code = misc, call-overload, attr-defined, no-untyped-call, union-attr, return-value, arg-type, assignment, operator
